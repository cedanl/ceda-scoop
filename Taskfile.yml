version: '3'

vars:
  BINARY: ceda-scoop

tasks:
  default:
    desc: Build en start de app
    cmds:
      - task: run

  build:
    desc: Compileer de binary (cross-platform)
    cmds:
      - go build -o {{.BINARY}}{{exeExt}} .
    sources:
      - "**/*.go"
    generates:
      - "{{.BINARY}}*"

  run:
    desc: Start de app vanuit source
    cmds:
      - go run .

  test:
    desc: Draai alle tests
    cmds:
      - go test ./...

  test:watch:
    desc: Draai tests bij bestandswijzigingen
    watch: true
    cmds:
      - go test ./...
    sources:
      - "**/*.go"

  lint:
    desc: Lint de code (vereist golangci-lint)
    cmds:
      - golangci-lint run

  clean:
    desc: Verwijder build artifacts
    cmds:
      - rm -f {{.BINARY}} {{.BINARY}}.exe

  snapshot:
    desc: Test release lokaal zonder te publiceren
    cmds:
      - goreleaser release --snapshot --clean

  release:
    desc: Publiceer een release via goreleaser (vereist GITHUB_TOKEN)
    cmds:
      - goreleaser release --clean
